<!doctype html><meta charset="utf-8"><title>V5 離線骨架樣板</title>
<script src="../vendor/three.min.js"></script><script src="../vendor/GLTFLoader.js"></script><script src="../vendor/GLTFExporter.js"></script>
<script src="roster.js"></script><script src="models/kit.js"></script><script src="models/gen12.js"></script><script src="models/gen34.js"></script><script src="models/special.js"></script><script src="rig-prototypes.js"></script>
<body style="margin:0;background:#e8ebdf"><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0xe8ebdf);scene.add(new THREE.HemisphereLight(0xfff9ed,0x809575,.8));const light=new THREE.DirectionalLight(0xffffff,.65);light.position.set(4,8,6);scene.add(light);const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(800,800);document.body.append(renderer.domElement);const camera=new THREE.PerspectiveCamera(38,1,.1,100);camera.position.set(0,3,9);camera.lookAt(0,1.5,0);const grid=new THREE.GridHelper(30,30);scene.add(grid);let model,mixer;
window.lab={renderer,scene,camera,async show(id,fromGLB=false){if(model)scene.remove(model);model=fromGLB?(await new THREE.GLTFLoader().loadAsync('../models/'+id+'.glb')).scene:V5RigPrototypes.build(id);scene.add(model);mixer=new THREE.AnimationMixer(model);if(!model.animations.length&&fromGLB){const glb=await new THREE.GLTFLoader().loadAsync('../models/'+id+'.glb');model.animations=glb.animations;}return model;},play(name,time=0){mixer.stopAllAction();const c=model.animations.find(c=>c.name===name);if(!c)throw Error('missing clip '+name);mixer.clipAction(c).play();mixer.setTime(time);renderer.render(scene,camera);},get model(){return model},get mixer(){return mixer},export(id){const x=V5RigPrototypes.build(id);return new Promise(resolve=>new THREE.GLTFExporter().parse(x,b=>resolve(Array.from(new Uint8Array(b))),{binary:true,animations:x.animations,onlyVisible:false}));}};
</script>
