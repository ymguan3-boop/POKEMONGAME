    <!-- 寶可夢圖鑑面板 -->

            <!-- Right -->

    <div id="power-bar-container" class="absolute bottom-8 right-[5.5rem] md:bottom-32 md:right-10 z-20 w-10 md:w-16 h-28 md:h-32 bg-black/60 border-2 border-slate-700 rounded-2xl p-1 md:p-1.5 flex flex-col justify-end items-center opacity-0 transition-opacity duration-200 pointer-events-none">

    <button id="btn-throw" class="absolute bottom-6 right-4 md:bottom-8 md:right-8 z-10 w-16 h-16 md:w-20 md:h-20 bg-gradient-to-b from-red-500 via-red-600 to-white border-4 border-slate-800 rounded-full flex items-center justify-center shadow-2xl transition-all touch-element focus:outline-none">

    <button id="btn-unlock" class="absolute bottom-[9.5rem] right-6 md:bottom-[6rem] md:right-32 z-10 w-10 h-10 md:w-12 md:h-12 bg-slate-800/80 border border-slate-400 rounded-full flex flex-col items-center justify-center shadow-lg active:scale-90 transition-all touch-element focus:outline-none scale-0 opacity-0 pointer-events-none origin-bottom">

    <div class="hidden md:flex absolute bottom-4 left-1/2 -translate-x-1/2 z-10 bg-black/40 backdrop-blur-sm text-gray-300 text-xs px-4 py-1.5 rounded-full pointer-events-none gap-4">

        <span>🎯 <kbd class="bg-gray-800 px-1 rounded text-white font-bold">L</kbd> 鎖定/切換 | <kbd class="bg-gray-800 px-1 rounded text-white font-bold">U</kbd> 取消鎖定</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'pokemon-3d-expedition';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        let db, auth, currentUserId;

        // --- 遊戲音效 ---
        const Sound = {
            ctx: null,
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            playThrow() {
                this.init(); const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.type = 'triangle'; osc.frequency.setValueAtTime(150, this.ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.start(); osc.stop(this.ctx.currentTime + 0.15);
            },
            playHit() {
                this.init(); const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(600, this.ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.start(); osc.stop(this.ctx.currentTime + 0.25);
            },
            playWobble() {
                this.init(); const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.type = 'sine'; osc.frequency.setValueAtTime(220, this.ctx.currentTime); osc.frequency.setValueAtTime(440, this.ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                osc.start(); osc.stop(this.ctx.currentTime + 0.12);
            },
            playEscape() {
                this.init(); const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, this.ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
                osc.start(); osc.stop(this.ctx.currentTime + 0.5);
            },
            playSuccess() {
                this.init(); const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.type = 'square'; osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
                    gain.gain.setValueAtTime(0.1, this.ctx.currentTime + idx * 0.08); gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.08 + 0.2);
                    osc.start(this.ctx.currentTime + idx * 0.08); osc.stop(this.ctx.currentTime + idx * 0.08 + 0.2);
                });
            }
        };

        const EVOLUTION_TARGETS = {
            pikachu: 'raichu', bulbasaur: 'ivysaur', squirtle: 'wartortle', charmander: 'charmeleon',
            pidgey: 'pidgeotto', oddish: 'gloom', geodude: 'graveler'
        };

        const EVOLUTION_THRESHOLD = 2; 

        // 傳說寶可夢逃脫機率
        const ESCAPE_RATES = {
            zapdos: 0.30,   // 30% 閃電鳥
            moltres: 0.50,  // 50% 火焰鳥
            articuno: 0.70, // 70% 急凍鳥
            mewtwo: 0.80    // 80% 超夢
        };

        const POKEDEX_DATA = {
            pikachu: { name: "皮卡丘", type: "電", color: "bg-yellow-500", border: "border-yellow-400", desc: "臉頰兩側有紅色的電力袋。遇到危險時會釋放高壓電。" },
            bulbasaur: { name: "妙蛙種子", type: "草/毒", color: "bg-emerald-500", border: "border-emerald-400", desc: "背上背著一顆神奇的植物種子，會隨身體一同長大。" },
            squirtle: { name: "傑尼龜", type: "水", color: "bg-blue-400", border: "border-blue-400", desc: "圓潤的甲殼不僅能保護身體，還能減少水中的阻力。" },

        const resolveCollision = (pos, radius) => {
            const bound = 135; 
            if (pos.x < -bound) pos.x = -bound; if (pos.x > bound) pos.x = bound;
            if (pos.z < -bound) pos.z = -bound; if (pos.z > bound) pos.z = bound;

            if (!gameState.obstacles) return;
            for (let obs of gameState.obstacles) {
                const dx = pos.x - obs.x; const dz = pos.z - obs.z;
                const distSq = dx * dx + dz * dz;
                const minRadius = radius + obs.radius;
                if (distSq < minRadius * minRadius && distSq > 0) {
                    const dist = Math.sqrt(distSq);
                    const overlap = minRadius - dist;
                    pos.x += (dx / dist) * overlap; pos.z += (dz / dist) * overlap;
                }
            }
        };

                    addPart(new THREE.SphereGeometry(0.38, 12, 12), bodyMat, 0, 0.5, 0.35);

                            const leaf = addPart(new THREE.ConeGeometry(0.3, 0.1, 4), leafMat, 0, 0.5, -0.15);

                    const blueMat = new THREE.MeshStandardMaterial({ color: isWar ? 0x3f51b5 : 0x4fc3f7 });

            update(time, delta) {
                if (this.isCaptured) return;
                
                if (this.idleTime > 0) {
                    this.idleTime -= delta;
                    this.mesh.rotation.y += Math.sin(time * 3 + this.seed) * 0.02; 
                } else {
                    const dir = new THREE.Vector3().subVectors(this.targetPos, this.mesh.position);
                    dir.y = 0;
                    const dist = dir.length();
                    
                    if (dist < 0.5) {
                        this.targetPos.set(this.spawnX + (Math.random() - 0.5) * 20, 0, this.spawnZ + (Math.random() - 0.5) * 20);
                        this.idleTime = 1 + Math.random() * 4;
                    } else {
                        dir.normalize();
                        let speed = 1.2;
                        if (this.isLegendary) speed = 4.5;
                        else if (this.type === 'pidgey' || this.type === 'pidgeotto' || this.type === 'mew') speed = 2.5;

                        this.mesh.position.addScaledVector(dir, speed * delta);
                        
                        const oldX = this.mesh.position.x; const oldZ = this.mesh.position.z;
                        resolveCollision(this.mesh.position, 0.35);

                        if (Math.abs(oldX - this.mesh.position.x) > 0.05 || Math.abs(oldZ - this.mesh.position.z) > 0.05) {
                            if (Math.random() < 0.1) {
                                this.targetPos.set(this.spawnX + (Math.random() - 0.5) * 20, 0, this.spawnZ + (Math.random() - 0.5) * 20);
                                this.idleTime = 0.5;
                            }
                        }

                        const targetAngle = Math.atan2(dir.x, dir.z);
                        const diff = Math.atan2(Math.sin(targetAngle - this.mesh.rotation.y), Math.cos(targetAngle - this.mesh.rotation.y));
                        this.mesh.rotation.y += diff * 5 * delta;
                    }
                }

                this.bounceTime += delta * 15;
                if (['mew', 'pidgey', 'pidgeotto', 'zapdos', 'moltres', 'articuno'].includes(this.type)) {
                    this.mesh.position.y = this.originalY + Math.sin(this.bounceTime * 0.2) * 0.2; 
                } else if (this.type === 'mewtwo') {
                    this.mesh.position.y = this.originalY + Math.sin(this.bounceTime * 0.15) * 0.15; 
                } else {
                    this.mesh.position.y = this.originalY + Math.abs(Math.sin(this.bounceTime * 0.4)) * 0.3; 
                }

                // 更新神獸特有的動畫
                if (this.customData) {
                    if (this.customData.wingL && this.customData.wingR) {
                        this.customData.wingL.rotation.z = Math.sin(time * 5 + this.seed) * 0.3;
                        this.customData.wingR.rotation.z = -Math.sin(time * 5 + this.seed) * 0.3;
                    }
                    if (this.customData.armL && this.customData.armR) {
                        this.customData.armL.rotation.x = Math.sin(time * 2 + this.seed) * 0.1;
                        this.customData.armR.rotation.x = Math.sin(time * 2 + this.seed) * 0.1;
                    }
                }
            }
        }

            thumbScene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const light = new THREE.DirectionalLight(0xffffff, 1.2); light.position.set(5, 5, 5); thumbScene.add(light);

            Object.keys(POKEDEX_DATA).forEach(type => {
                const tempPoke = new Pokemon(type, 0, 0);
                // 神獸在圖鑑縮圖中強迫縮小以顯示全身
                if (['zapdos', 'moltres', 'articuno', 'mewtwo'].includes(type)) {
                    tempPoke.mesh.scale.set(1.0, 1.0, 1.0);

                tempPoke.mesh.rotation.y = -Math.PI / 8; 
                thumbScene.add(tempPoke.mesh); thumbRenderer.render(thumbScene, thumbCam);

            });
        };

        const spawnLegendary = (type) => {
            const angle = Math.random() * Math.PI * 2;
            const dist = 15 + Math.random() * 15;
            const p = new Pokemon(type, player.position.x + Math.cos(angle) * dist, player.position.z + Math.sin(angle) * dist);
            resolveCollision(p.mesh.position, 0.35);
            p.spawnX = p.mesh.position.x; p.spawnZ = p.mesh.position.z;
            scene.add(p.mesh); gameState.pokemons.push(p);
        };

        const checkLegendarySpawns = (unlockedCount, totalObj) => {
            const progress = unlockedCount / totalObj;
            if (progress >= 0.30 && !gameState.legendarySpawned.zapdos) {
                gameState.legendarySpawned.zapdos = true; spawnLegendary('zapdos'); showNotification("⚡ 傳說中的閃電鳥降臨了！");
            }
            if (progress >= 0.50 && !gameState.legendarySpawned.moltres) {
                gameState.legendarySpawned.moltres = true; spawnLegendary('moltres'); showNotification("🔥 傳說中的火焰鳥降臨了！");
            }
            if (progress >= 0.80 && !gameState.legendarySpawned.articuno) {
                gameState.legendarySpawned.articuno = true; spawnLegendary('articuno'); showNotification("❄️ 傳說中的急凍鳥降臨了！");
            }
            if (unlockedCount >= totalObj - 1 && !gameState.legendarySpawned.mewtwo) {
                gameState.legendarySpawned.mewtwo = true; spawnLegendary('mewtwo'); showNotification("🌌 最強的超夢覺醒了！");
            }
            saveGameData();
        };

            gameState.pokemons.forEach(p => scene.remove(p.mesh));
            gameState.pokemons = [];
            
            const selected = BASE_SPAWN_TYPES.sort(() => 0.5 - Math.random()).slice(0, 6);
            selected.forEach((type, i) => {
                const angle = (i / 6) * Math.PI * 2; const dist = 10 + Math.random() * 15;
                const p = new Pokemon(type, Math.cos(angle) * dist, Math.sin(angle) * dist);
                resolveCollision(p.mesh.position, 0.35); 
                p.spawnX = p.mesh.position.x; p.spawnZ = p.mesh.position.z;
                scene.add(p.mesh); gameState.pokemons.push(p);
            });

            Object.keys(gameState.legendarySpawned).forEach(leg => {
                if (gameState.legendarySpawned[leg] && !gameState.pokedexUnlocks[leg]) {
                    spawnLegendary(leg);
                }
            });
        };

                        ${isUnlocked ? info.type : "???"}

                    <p class="text-xs mt-3 text-left w-full flex-1 leading-relaxed ${isUnlocked ? 'text-gray-300' : 'text-slate-600 font-bold tracking-widest text-center flex items-center justify-center'}">
                        ${isUnlocked ? info.desc : "？？？？？？<br>？？？？"}
                    </p>
                `;
                listDiv.appendChild(card);
            });

            const totalObj = Object.keys(POKEDEX_DATA).length;
            const statusText = `${unlockedCount} / ${totalObj}`;
            document.getElementById('pokedex-progress').innerText = statusText;
            document.getElementById('hud-capture-score').innerText = statusText;
            document.getElementById('pokedex-progress-bar').style.width = `${(unlockedCount / totalObj) * 100}%`;
            
            checkLegendarySpawns(unlockedCount, totalObj);
        };

        const showCaptureCard = (type) => {
            const info = POKEDEX_DATA[type];
            document.getElementById('capture-name').innerText = info.name;
            document.getElementById('capture-desc').innerText = info.desc;
            
            const badge = document.getElementById('capture-type-badge');
            badge.innerText = info.type;
            badge.className = `px-2 py-0.5 rounded text-[10px] font-bold text-white uppercase ${info.color}`;

            const hintDiv = document.getElementById('capture-evo-hint');
            const targetEvo = EVOLUTION_TARGETS[type];
            if (['zapdos', 'moltres', 'articuno', 'mewtwo'].includes(type)) {
                hintDiv.innerText = `✨ 降伏了傳說中的存在！`;
                hintDiv.className = "mt-3 text-[10px] text-purple-400 font-bold bg-purple-900/40 py-1 rounded animate-pulse";
            } else if (targetEvo) {
                const count = gameState.captureCounts[type];
                const remain = EVOLUTION_THRESHOLD - count;
                if (remain > 0) {
                    hintDiv.innerText = `再捕捉 ${remain} 隻即可發現進化型態！`;
                    hintDiv.className = "mt-3 text-[10px] text-yellow-400/80 font-bold bg-yellow-400/10 py-1 rounded";
                } else if (remain === 0) {
                    hintDiv.innerText = `✨ 進化型態已解鎖，即將現身！`;
                    hintDiv.className = "mt-3 text-[10px] text-emerald-400 font-bold bg-emerald-400/20 py-1 rounded animate-pulse";
                } else {
                    hintDiv.innerText = `已完全掌握此生態。`;
                    hintDiv.className = "mt-3 text-[10px] text-gray-400 font-bold bg-gray-800/50 py-1 rounded";
                }
            } else {
                hintDiv.innerText = `繼續你的遠征旅程吧！`;
                hintDiv.className = "mt-3 text-[10px] text-gray-400 bg-transparent py-1";
            }

            if (captureModel) captureScene.remove(captureModel.mesh);
            captureModel = new Pokemon(type, 0, 0);
            
            // 讓神獸在捕捉卡片中也不要超出框框
            if (['zapdos', 'moltres', 'articuno', 'mewtwo'].includes(type)) {
                captureModel.mesh.scale.set(1.2, 1.2, 1.2); 
            }
            
            captureScene.add(captureModel.mesh);

            document.getElementById('capture-card').classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('capture-card').classList.add('pointer-events-auto');
            document.getElementById('capture-card-inner').classList.remove('scale-90');
            document.getElementById('capture-card-inner').classList.add('scale-100');
            
            gameState.isShowingCapture = true;
        };

        const showNotification = (text) => {
            const el = document.getElementById('notification');
            el.innerText = text; el.classList.remove('opacity-0'); el.classList.add('opacity-100');
            setTimeout(() => { el.classList.remove('opacity-100'); el.classList.add('opacity-0'); }, 3000);
        };

        const keys = { w: false, a: false, s: false, d: false };
        const dpad = { up: false, down: false, left: false, right: false }; // 十字鍵狀態
        let spacePressed = false; 

        window.addEventListener('keydown', (e) => {
            if (e.key === ' ' && !spacePressed) { spacePressed = true; startCharging(); }
            if (e.key === 'l' || e.key === 'L') handleLockBtnClick();
            if (e.key === 'u' || e.key === 'U') cancelLock();
            if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === ' ') { spacePressed = false; releaseAndThrow(); }
            if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = false;
        });

        const startCharging = () => {
            if (gameState.isCharging) return;
            gameState.isCharging = true; gameState.chargePower = 0.05; gameState.chargeDirection = 1;
            document.getElementById('power-bar-container').classList.remove('opacity-0');
            document.getElementById('power-bar-container').classList.add('opacity-100');
        };

        const updateCharging = (delta) => {
            if (!gameState.isCharging) return;
            gameState.chargePower += 1.5 * delta * gameState.chargeDirection;
            if (gameState.chargePower >= 1.0) { gameState.chargePower = 1.0; gameState.chargeDirection = -1; }
            else if (gameState.chargePower <= 0.05) { gameState.chargePower = 0.05; gameState.chargeDirection = 1; }

            const percent = Math.floor(gameState.chargePower * 100);
            const fill = document.getElementById('power-bar-fill');
            fill.style.height = `${percent}%`;
            document.getElementById('power-text').innerText = `${percent}%`;

            if (percent > 80) fill.className = "w-full bg-gradient-to-t from-red-500 via-rose-500 to-red-600 h-0 shadow-[0_0_8px_#f43f5e]";
            else if (percent > 40) fill.className = "w-full bg-gradient-to-t from-emerald-500 via-yellow-400 to-amber-500 h-0";
            else fill.className = "w-full bg-gradient-to-t from-emerald-400 via-emerald-500 to-green-500 h-0";
        };

        const releaseAndThrow = () => {
            if (!gameState.isCharging) return;
            gameState.isCharging = false;
            document.getElementById('power-bar-container').classList.add('opacity-0');
            
            const angle = player.rotation.y;
            const powerRatio = 0.5 + gameState.chargePower * 1.1;
            const ballGroup = new THREE.Group();
            ballGroup.position.set(player.position.x + Math.sin(angle)*0.6, player.position.y + 1.6, player.position.z + Math.cos(angle)*0.6);
            
            const r = 0.25;
            ballGroup.add(new THREE.Mesh(new THREE.SphereGeometry(r, 16, 16, 0, Math.PI*2, 0, Math.PI/2), new THREE.MeshStandardMaterial({color:0xf44336})));
            ballGroup.add(new THREE.Mesh(new THREE.SphereGeometry(r, 16, 16, 0, Math.PI*2, Math.PI/2, Math.PI/2), new THREE.MeshStandardMaterial({color:0xffffff})));
            const belt = new THREE.Mesh(new THREE.CylinderGeometry(r+0.01, r+0.01, 0.03, 16), new THREE.MeshStandardMaterial({color:0x212121}));
            belt.rotation.x = Math.PI/2; ballGroup.add(belt); scene.add(ballGroup);

            const vel = new THREE.Vector3(Math.sin(angle), 0.2, Math.cos(angle)).normalize().multiplyScalar(13.5 * powerRatio);
            vel.y += 5.5 * (0.5 + powerRatio * 0.5);

            gameState.activeBalls.push({ mesh: ballGroup, velocity: vel, gravity: -12.0, life: 6.0, targetPokemon: null, wobblePhase: 0, wobbleTimer: 0, wobblesCount: 0 });
            Sound.playThrow(); armR.rotation.x = -Math.PI / 1.5; setTimeout(() => armR.rotation.x = -Math.PI / 4, 300);
        };

        const updateLockUI = () => {
            const btnLock = document.getElementById('btn-lock');
            const btnUnlock = document.getElementById('btn-unlock');
            if (gameState.autoLock) {
                btnLock.className = "absolute bottom-24 right-5 md:bottom-8 md:right-32 z-10 w-12 h-12 md:w-14 md:h-14 bg-red-950/70 border border-red-500 rounded-full flex flex-col items-center justify-center shadow-[0_0_15px_rgba(239,68,68,0.5)] touch-element focus:outline-none";
                document.getElementById('lock-text').className = "text-[8px] md:text-[9px] text-red-400 font-bold mt-0.5 whitespace-nowrap pointer-events-none";
                document.getElementById('lock-text').innerText = "切換目標";
                document.getElementById('lock-icon').innerText = "🔄";
                if(btnUnlock) {
                    btnUnlock.classList.remove('scale-0', 'opacity-0', 'pointer-events-none');
                    btnUnlock.classList.add('scale-100', 'opacity-100', 'pointer-events-auto');
                }
            } else {
                btnLock.className = "absolute bottom-24 right-5 md:bottom-8 md:right-32 z-10 w-12 h-12 md:w-14 md:h-14 bg-black/70 border border-white/30 rounded-full flex flex-col items-center justify-center shadow-2xl active:scale-90 transition-all touch-element focus:outline-none";
                document.getElementById('lock-text').className = "text-[8px] md:text-[9px] text-gray-300 font-bold mt-0.5 whitespace-nowrap pointer-events-none";
                document.getElementById('lock-text').innerText = "鎖定最近";
                document.getElementById('lock-icon').innerText = "🎯";
                if(btnUnlock) {
                    btnUnlock.classList.add('scale-0', 'opacity-0', 'pointer-events-none');
                    btnUnlock.classList.remove('scale-100', 'opacity-100', 'pointer-events-auto');
                }
            }
        };

        const cancelLock = () => {
            gameState.autoLock = false;
            gameState.lockedTarget = null;
            updateLockUI();
        };

        const handleLockBtnClick = () => {
            const validPokemons = gameState.pokemons.filter(p => !p.isCaptured);
            if (validPokemons.length === 0) return;

            if (!gameState.autoLock || !gameState.lockedTarget) {
                // 鎖定最近的
                let target = null, minDist = Infinity;
                validPokemons.forEach(p => {
                    const d = player.position.distanceTo(p.mesh.position);
                    if (d < minDist) { minDist = d; target = p; }
                });
                gameState.lockedTarget = target;
                gameState.autoLock = true;
            } else {
                // 切換目標 (依據與玩家的距離排序後取下一個)
                validPokemons.sort((a, b) => player.position.distanceTo(a.mesh.position) - player.position.distanceTo(b.mesh.position));
                const currentIndex = validPokemons.indexOf(gameState.lockedTarget);
                if (currentIndex !== -1) {
                    const nextIndex = (currentIndex + 1) % validPokemons.length;
                    gameState.lockedTarget = validPokemons[nextIndex];
                } else {
                    gameState.lockedTarget = validPokemons[0];
                }
            }
            updateLockUI();
        };

        const drawRadar = () => {
            const radarCanvas = document.getElementById('radar-canvas'); 
            if (!radarCanvas) return;
            const radarCtx = radarCanvas.getContext('2d');
            radarCtx.clearRect(0, 0, 110, 110);
            radarCtx.beginPath(); radarCtx.arc(55, 55, 50, 0, Math.PI*2); radarCtx.fillStyle='rgba(12,45,23,0.6)'; radarCtx.fill();
            radarCtx.strokeStyle='rgba(74,222,128,0.4)'; radarCtx.stroke();
            
            // 雷達跟隨獨立相機視角旋轉
            radarCtx.save(); radarCtx.translate(55, 55); radarCtx.rotate(-gameState.camAngle);
            radarCtx.beginPath(); radarCtx.moveTo(0,-7); radarCtx.lineTo(-5,5); radarCtx.lineTo(0,2); radarCtx.lineTo(5,5); radarCtx.fillStyle='#3b82f6'; radarCtx.fill();
            radarCtx.restore();
            
            gameState.pokemons.forEach(p => {
                if (p.isCaptured) return;
                const dx = p.mesh.position.x - player.position.x; const dz = p.mesh.position.z - player.position.z;
                const dist = Math.sqrt(dx*dx + dz*dz);
                if (dist < 50) {
                    const angle = Math.atan2(dx, dz) - gameState.camAngle;
                    const rx = 55 + Math.sin(angle) * (dist/50)*45; const ry = 55 - Math.cos(angle) * (dist/50)*45;
                    radarCtx.beginPath(); radarCtx.arc(rx, ry, 3.8, 0, Math.PI*2); 
                    radarCtx.fillStyle = p.isLegendary ? '#ef4444' : '#facc15'; 
                    radarCtx.fill();
                }
            });
        };

        const clock = new THREE.Clock();
        const animate = () => {
            requestAnimationFrame(animate);
            if (!scene) return;
            const delta = clock.getDelta(); const time = clock.getElapsedTime();

            // --- 神獸 BGM 動態切換 (已優化，無縫且無延遲) ---
            if (gameState.bgmStarted) {
                const hasLegendary = gameState.pokemons.some(p => p.isLegendary && !p.isCaptured);
                const bgmNormal = document.getElementById('bgm-normal');
                const bgmBoss = document.getElementById('bgm-boss');
                
                if (hasLegendary && gameState.currentBGM !== 'boss') {
                    gameState.currentBGM = 'boss';
                    if (bgmNormal) bgmNormal.pause();
                    if (bgmBoss) {
                        bgmBoss.currentTime = 0; // Boss BGM 每次重新播放增加氣勢
                        bgmBoss.play().catch(e => console.log("BGM切換中需互動"));
                    }
                } else if (!hasLegendary && gameState.currentBGM !== 'normal') {
                    gameState.currentBGM = 'normal';
                    if (bgmBoss) bgmBoss.pause();
                    if (bgmNormal) bgmNormal.play().catch(e => console.log("BGM切換中需互動"));
                }
            }

            for (let i = gameState.respawnQueue.length - 1; i >= 0; i--) {
                const respawn = gameState.respawnQueue[i];
                if (time >= respawn.time) {
                    const newPoke = new Pokemon(respawn.type, respawn.x, respawn.z);
                    resolveCollision(newPoke.mesh.position, 0.35); 
                    newPoke.spawnX = newPoke.mesh.position.x; newPoke.spawnZ = newPoke.mesh.position.z;
                    scene.add(newPoke.mesh); gameState.pokemons.push(newPoke);
                    gameState.respawnQueue.splice(i, 1);
                    const geo = new THREE.SphereGeometry(0.1, 8, 8); const mat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                    for(let k=0; k<15; k++){
                        const m = new THREE.Mesh(geo, mat); m.position.set(respawn.x, 1, respawn.z); scene.add(m);
                        gameState.particles.push({ mesh: m, velocity: new THREE.Vector3((Math.random()-0.5)*4, Math.random()*5, (Math.random()-0.5)*4), life: 0.5 });
                    }
                }
            }

            if (gameState.isShowingCapture && captureModel) {
                captureModel.mesh.rotation.y += 1.5 * delta; captureRenderer.render(captureScene, captureCam);
            }

            updateCharging(delta); drawRadar();

            let mx = 0, mz = 0;
            if (keys.w || dpad.up) mz += 1; 
            if (keys.s || dpad.down) mz -= 1; 
            if (keys.a || dpad.left) mx += 1; 
            if (keys.d || dpad.right) mx -= 1;
            
            let isMovingManual = false;

            // 第三人稱視覺相對移動 (與相機視角解綁)
            if ((mx !== 0 || mz !== 0) && !gameState.isShowingCapture) {
                isMovingManual = true;
                
                // 以獨立的相機視角 (camAngle) 作為基準計算移動方向
                const moveAngle = gameState.camAngle + Math.atan2(mx, mz);
                const moveDir = new THREE.Vector3(Math.sin(moveAngle), 0, Math.cos(moveAngle)).normalize();

                player.position.addScaledVector(moveDir, 6.0 * delta);
                resolveCollision(player.position, 0.4); 
                
                // 角色平滑轉向移動方向 (不再影響相機，解決了按下旋轉亂轉的問題)
                if (!gameState.autoLock) {
                    const diff = Math.atan2(Math.sin(moveAngle - player.rotation.y), Math.cos(moveAngle - player.rotation.y));
                    player.rotation.y += diff * 15 * delta; // 快速向後轉
                }
            }

            // 自動鎖定與自動逼近邏輯 (加入 captureInProgress 判斷，捕捉時不切換目標)
            if (gameState.autoLock && !gameState.isShowingCapture && !gameState.captureInProgress) {
                // 若當前鎖定目標已捕捉，自動切換至下一個最近的，若無則取消
                if (gameState.lockedTarget && gameState.lockedTarget.isCaptured) {
                    const validPokemons = gameState.pokemons.filter(p => !p.isCaptured);
                    if (validPokemons.length > 0) {
                        let target = null, minDist = Infinity;
                        validPokemons.forEach(p => {
                            const d = player.position.distanceTo(p.mesh.position);
                            if (d < minDist) { minDist = d; target = p; }
                        });
                        gameState.lockedTarget = target;
                    } else {
                        cancelLock();
                    }
                }

                if (gameState.lockedTarget && !gameState.lockedTarget.isCaptured) {
                    const target = gameState.lockedTarget;
                    lockOnRing.position.copy(target.mesh.position); lockOnRing.position.y = 0.08;
                    lockOnRing.rotation.z += 2*delta; lockOnRing.visible = true;
                    
                    const dx = target.mesh.position.x - player.position.x; const dz = target.mesh.position.z - player.position.z;
                    const targetYaw = Math.atan2(dx, dz);

                    // 如果沒有在手動移動，角色平滑轉向目標
                    if (!isMovingManual) {
                        const diffPlayer = Math.atan2(Math.sin(targetYaw - player.rotation.y), Math.cos(targetYaw - player.rotation.y));
                        player.rotation.y += diffPlayer * 10 * delta; 
                    }

                    // 鎖定時，讓獨立相機視角緩慢跟隨目標，保持在背後
                    const diffCam = Math.atan2(Math.sin(targetYaw - gameState.camAngle), Math.cos(targetYaw - gameState.camAngle));
                    gameState.camAngle += diffCam * 2.0 * delta;

                    const dist = player.position.distanceTo(target.mesh.position);
                    // 自動逼近目標到適當距離
                    if (dist > 12.0 && !isMovingManual) {
                        const approachDir = new THREE.Vector3(dx, 0, dz).normalize();
                        player.position.addScaledVector(approachDir, 4.0 * delta); 
                        resolveCollision(player.position, 0.4);
                    }
                } else lockOnRing.visible = false;
            } else {
                lockOnRing.visible = false;
            }

            gameState.pokemons.forEach(p => p.update(time, delta));

            for (let i = gameState.activeBalls.length - 1; i >= 0; i--) {
                const ball = gameState.activeBalls[i]; 
                
                // 如果球處於捕捉成功的閒置展示狀態 (wobblePhase === 4)，不計算壽命和移動
                if (ball.wobblePhase === 4) continue;
                
                ball.life -= delta;
                if (ball.life <= 0) { scene.remove(ball.mesh); gameState.activeBalls.splice(i, 1); continue; }

                if (ball.wobblePhase === 0) {
                    ball.velocity.y += ball.gravity * delta; ball.mesh.position.addScaledVector(ball.velocity, delta);
                    ball.mesh.rotation.x += 5*delta; ball.mesh.rotation.y += 2*delta;
                    if (ball.mesh.position.y < 0.25) { ball.mesh.position.y = 0.25; ball.velocity.y = -ball.velocity.y*0.4; ball.velocity.x *= 0.7; ball.velocity.z *= 0.7; }
                    for (let j = gameState.pokemons.length - 1; j >= 0; j--) {
                        const pk = gameState.pokemons[j];
                        if (!pk.isCaptured && ball.mesh.position.distanceTo(pk.mesh.position.clone().add(new THREE.Vector3(0,0.5,0))) < 0.85) {
                            ball.wobblePhase = 1; ball.targetPokemon = pk; pk.isCaptured = true;
                            gameState.captureInProgress = true; // 擊中瞬間暫停鎖定切換
                            Sound.playHit(); scene.remove(pk.mesh); ball.velocity.set(0, 2.0, 0); break;
                        }
                    }
                } else if (ball.wobblePhase === 1) {
                    ball.velocity.y += ball.gravity * delta; ball.mesh.position.addScaledVector(ball.velocity, delta);
                    ball.mesh.rotation.x *= 0.95; ball.mesh.rotation.y *= 0.95; ball.mesh.rotation.z *= 0.95;
                    if (ball.mesh.position.y <= 0.25) { ball.mesh.position.y = 0.25; ball.velocity.set(0,0,0); ball.wobblePhase = 2; }
                } else if (ball.wobblePhase === 2) {
                    ball.wobbleTimer += delta;
                    if (ball.wobbleTimer >= 0.3) {
                        ball.wobbleTimer = 0; ball.wobblesCount++; Sound.playWobble();
                        const shake = () => { let s=0; const f=()=>{ if(s<12){ ball.mesh.rotation.z=Math.sin(s)*0.4; s++; setTimeout(f,16);} else ball.mesh.rotation.z=0; }; f(); }; shake();
                        if (ball.wobblesCount >= 3) ball.wobblePhase = 3;
                    }
                } else if (ball.wobblePhase === 3) {
                    const pk = ball.targetPokemon;
                    if (pk) {
                        const type = pk.type;
                        
                        // 判定是否觸發逃脫 (針對傳說寶可夢)
                        let escaped = false;
                        if (ESCAPE_RATES[type] && Math.random() < ESCAPE_RATES[type]) {
                            escaped = true;
                        }

                        if (escaped) {
                            // 逃脫處理
                            pk.isCaptured = false;
                            gameState.captureInProgress = false; // 恢復鎖定切換
                            
                            // 瞬移到隨機新位置
                            const angle = Math.random() * Math.PI * 2;
                            const dist = 12 + Math.random() * 20; // 距離玩家 12~32 單位
                            pk.mesh.position.set(player.position.x + Math.cos(angle)*dist, pk.originalY, player.position.z + Math.sin(angle)*dist);
                            resolveCollision(pk.mesh.position, 0.35);
                            pk.spawnX = pk.mesh.position.x; pk.spawnZ = pk.mesh.position.z;
                            pk.targetPos.set(pk.spawnX, 0, pk.spawnZ);
                            
                            scene.add(pk.mesh); // 重新放回場景
                            showNotification(`啊！${POKEDEX_DATA[type].name} 掙脫並逃跑了！`);
                            Sound.playEscape();

                            // 產生白煙爆裂逃脫特效
                            const geo = new THREE.BoxGeometry(0.15, 0.15, 0.15); 
                            const mat = new THREE.MeshBasicMaterial({color: 0xeeeeee});
                            for(let k = 0; k < 30; k++){
                                const m = new THREE.Mesh(geo, mat); m.position.copy(ball.mesh.position); scene.add(m);
                                const a1 = Math.random() * Math.PI * 2, a2 = Math.random() * Math.PI, sp = 3 + Math.random() * 5;
                                gameState.particles.push({mesh: m, velocity: new THREE.Vector3(Math.sin(a2)*Math.cos(a1)*sp, Math.cos(a2)*sp, Math.sin(a2)*Math.sin(a1)*sp), life: 1.2});
                            }
                            scene.remove(ball.mesh); gameState.activeBalls.splice(i, 1);

                        } else {
                            // 原本的成功捕捉邏輯
                            gameState.pokedexUnlocks[type] = true; gameState.captureCounts[type]++;
                            
                            showCaptureCard(type); updatePokedexUI(); Sound.playSuccess();
                            saveGameData(); 
                            
                            if (!pk.isLegendary) {
                                let nextSpawnType = type;
                                if (EVOLUTION_TARGETS[type] && gameState.captureCounts[type] >= EVOLUTION_THRESHOLD && !gameState.pokedexUnlocks[EVOLUTION_TARGETS[type]]) {
                                    nextSpawnType = EVOLUTION_TARGETS[type]; 
                                } else {
                                    nextSpawnType = BASE_SPAWN_TYPES[Math.floor(Math.random() * BASE_SPAWN_TYPES.length)]; 
                                }
                                gameState.respawnQueue.push({ type: nextSpawnType, x: pk.spawnX, z: pk.spawnZ, time: clock.getElapsedTime() + 5.0 });
                            }

                            if (type === 'mewtwo') {
                                setTimeout(() => {
                                    document.getElementById('victory-modal').classList.remove('hidden');
                                }, 2000);
                            }

                            // 讓寶貝球停留在原地 (進入 phase 4)，並發射 3 顆黃色小星星特效
                            ball.wobblePhase = 4;
                            const starGeo = new THREE.OctahedronGeometry(0.12); 
                            const starMat = new THREE.MeshBasicMaterial({color: 0xffeb3b});
                            for(let k = 0; k < 3; k++){
                                const star = new THREE.Mesh(starGeo, starMat);
                                star.position.copy(ball.mesh.position);
                                star.position.y += 0.3; // 從球上方冒出
                                scene.add(star);
                                
                                const starAngle = (k - 1) * 0.6; // 分散角度 (-0.6, 0, 0.6)
                                gameState.particles.push({
                                    mesh: star,
                                    velocity: new THREE.Vector3(Math.sin(starAngle)*1.5, 3.5 + Math.random(), Math.cos(starAngle)*1.5),
                                    life: 1.5,
                                    isStar: true // 標記為星星以應用特殊漂浮物理
                                });
                            }
                            
                            // 產生捕捉成功的金粉特效
                            const dustGeo = new THREE.BoxGeometry(0.08,0.08,0.08); 
                            for(let k=0;k<20;k++){
                                const m = new THREE.Mesh(dustGeo, starMat); m.position.copy(ball.mesh.position); scene.add(m);
                                const a1=Math.random()*Math.PI*2, a2=Math.random()*Math.PI, sp=1.5+Math.random()*4;
                                gameState.particles.push({mesh:m, velocity:new THREE.Vector3(Math.sin(a2)*Math.cos(a1)*sp, Math.cos(a2)*sp+1.5, Math.sin(a2)*Math.sin(a1)*sp), life:0.8});
                            }
                        }
                    }
                }
            }

            for (let i = gameState.particles.length - 1; i >= 0; i--) {
                const p = gameState.particles[i]; p.life -= delta;
                if (p.life <= 0) { scene.remove(p.mesh); gameState.particles.splice(i, 1); continue; }
                p.mesh.position.addScaledVector(p.velocity, delta); 
                
                // 星星特效特殊物理: 較輕的重力與旋轉
                if (p.isStar) {
                    p.velocity.y -= 4.0 * delta; 
                    p.mesh.rotation.y += 6 * delta;
                    p.mesh.rotation.x += 3 * delta;
                } else {
                    p.velocity.y -= 9.8 * delta; 
                    p.mesh.scale.multiplyScalar(0.96);
                }
            }

            // 相機追蹤改為綁定獨立的 camAngle
            const targetCamPos = new THREE.Vector3(
                player.position.x - Math.sin(gameState.camAngle) * gameState.cameraDistance,
                player.position.y + 4.0,
                player.position.z - Math.cos(gameState.camAngle) * gameState.cameraDistance
            );
            camera.position.lerp(targetCamPos, 0.12); camera.lookAt(player.position.clone().add(new THREE.Vector3(0,1.2,0)));

            renderer.render(scene, camera);
        };

        const initUI = () => {
            // 新增: 觸控/滑鼠拖曳旋轉相機視角
            let isDraggingCam = false;
            let prevTouchX = 0;
            const canvasContainer = document.getElementById('canvas-container');
            
            canvasContainer.addEventListener('touchstart', (e) => {
                if (e.target.id === 'canvas-container' || e.target.tagName === 'CANVAS') {
                    isDraggingCam = true; prevTouchX = e.touches[0].clientX;
                }
            }, {passive: true});
            canvasContainer.addEventListener('touchmove', (e) => {
                if (isDraggingCam) {
                    const deltaX = e.touches[0].clientX - prevTouchX;
                    gameState.camAngle -= deltaX * 0.006; 
                    prevTouchX = e.touches[0].clientX;
                }
            }, {passive: true});
            canvasContainer.addEventListener('touchend', () => isDraggingCam = false);
            
            canvasContainer.addEventListener('mousedown', (e) => {
                if (e.target.id === 'canvas-container' || e.target.tagName === 'CANVAS') {
                    isDraggingCam = true; prevTouchX = e.clientX;
                }
            });
            window.addEventListener('mousemove', (e) => {
                if (isDraggingCam) {
                    const deltaX = e.clientX - prevTouchX;
                    gameState.camAngle -= deltaX * 0.006;
                    prevTouchX = e.clientX;
                }
            });
            window.addEventListener('mouseup', () => isDraggingCam = false);

            const bgmNormal = document.getElementById('bgm-normal');
            const bgmBoss = document.getElementById('bgm-boss');
            const bgmVolume = document.getElementById('bgm-volume');
            
            if (bgmNormal) bgmNormal.volume = bgmVolume.value; 
            if (bgmBoss) bgmBoss.volume = bgmVolume.value;

            bgmVolume.addEventListener('input', (e) => {
                if (bgmNormal) bgmNormal.volume = e.target.value;
                if (bgmBoss) bgmBoss.volume = e.target.value;
                if (gameState.bgmStarted && e.target.value > 0) {
                    if (gameState.currentBGM === 'normal' && bgmNormal && bgmNormal.paused) bgmNormal.play().catch(()=>{});
                    if (gameState.currentBGM === 'boss' && bgmBoss && bgmBoss.paused) bgmBoss.play().catch(()=>{});
                }
            });

            const startBGM = () => {
                if (!gameState.bgmStarted && bgmVolume.value > 0) {
                    if (bgmNormal) {
                        bgmNormal.play().then(() => { gameState.bgmStarted = true; }).catch(e => console.log("等待互動以播放音樂"));
                    }
                }
            };
            window.addEventListener('click', startBGM, { once: true });
            window.addEventListener('touchstart', startBGM, { once: true });

            const bindTouch = (id, start, end) => {
                const el = document.getElementById(id);
                if (!el) return;
                el.addEventListener('touchstart', (e)=>{e.preventDefault();start();}, {passive:false});
                el.addEventListener('mousedown', start);
                if(end) { el.addEventListener('touchend', (e)=>{e.preventDefault();end();}, {passive:false}); window.addEventListener('mouseup', end); }
            };

            bindTouch('btn-throw', startCharging, releaseAndThrow);
            
            const btnLock = document.getElementById('btn-lock');
            if(btnLock) btnLock.addEventListener('click', handleLockBtnClick);

            const btnUnlock = document.getElementById('btn-unlock');
            if(btnUnlock) btnUnlock.addEventListener('click', cancelLock);
            
            const btnPokedex = document.getElementById('btn-pokedex');
            if(btnPokedex) btnPokedex.addEventListener('click', () => {
                updatePokedexUI(); document.getElementById('pokedex-modal').classList.remove('hidden');
            });
            
            const btnClosePokedex = document.getElementById('btn-close-pokedex');
            if(btnClosePokedex) btnClosePokedex.addEventListener('click', () => {
                document.getElementById('pokedex-modal').classList.add('hidden');
            });

            const btnCloseCapture = document.getElementById('btn-close-capture');
            if(btnCloseCapture) btnCloseCapture.addEventListener('click', () => {
                document.getElementById('capture-card').classList.add('opacity-0', 'pointer-events-none');
                document.getElementById('capture-card').classList.remove('pointer-events-auto');
                document.getElementById('capture-card-inner').classList.add('scale-90');
                document.getElementById('capture-card-inner').classList.remove('scale-100');
                
                gameState.isShowingCapture = false;
                gameState.captureInProgress = false; // 收下後，恢復自動鎖定的切換邏輯
                
                // 清除留在地上的寶貝球 (Phase 4)
                for (let i = gameState.activeBalls.length - 1; i >= 0; i--) {
                    if (gameState.activeBalls[i].wobblePhase === 4) {
                        scene.remove(gameState.activeBalls[i].mesh);
                        gameState.activeBalls.splice(i, 1);
                    }
                }
            });

            const resetProgress = async () => {
                Object.keys(POKEDEX_DATA).forEach(k => { gameState.pokedexUnlocks[k] = false; gameState.captureCounts[k] = 0; });
                gameState.legendarySpawned = { zapdos: false, moltres: false, articuno: false, mewtwo: false };
                gameState.respawnQueue = [];
                player.position.set(0,0,0); player.rotation.y=0;
                initSpawns(); updatePokedexUI();
                await saveGameData(); 
                showNotification("進度已重置並儲存！準備好重新開始了嗎？");
            };

            const btnReset = document.getElementById('btn-reset');
            if(btnReset) btnReset.addEventListener('click', resetProgress);

            const btnVictoryReset = document.getElementById('btn-victory-reset');
            if(btnVictoryReset) btnVictoryReset.addEventListener('click', () => {
                document.getElementById('victory-modal').classList.add('hidden');
                resetProgress();
            });

            const btnVictoryClose = document.getElementById('btn-victory-close');
            if(btnVictoryClose) btnVictoryClose.addEventListener('click', () => {
                document.getElementById('victory-modal').classList.add('hidden');
            });

            const btnToggleMenu = document.getElementById('btn-toggle-menu');
            const mainMenuPanel = document.getElementById('main-menu-panel');
            let isMenuOpen = true;
            if(btnToggleMenu) btnToggleMenu.addEventListener('click', () => {
                isMenuOpen = !isMenuOpen;
                if (isMenuOpen) {
                    mainMenuPanel.classList.remove('scale-0', 'opacity-0', 'pointer-events-none');
                    mainMenuPanel.classList.add('scale-100', 'opacity-100');
                    btnToggleMenu.innerHTML = '<span class="text-lg">✕</span> <span class="text-xs font-bold md:inline">關閉選單</span>';
                } else {
                    mainMenuPanel.classList.add('scale-0', 'opacity-0', 'pointer-events-none');
                    mainMenuPanel.classList.remove('scale-100', 'opacity-100');
                    btnToggleMenu.innerHTML = '<span class="text-lg">☰</span> <span class="text-xs font-bold md:inline">選單</span>';
                }
            });

            const btnToggleRadar = document.getElementById('btn-toggle-radar');
            const radarContainer = document.getElementById('radar-container');
            let isRadarOpen = true;
            if(btnToggleRadar) btnToggleRadar.addEventListener('click', () => {
                isRadarOpen = !isRadarOpen;
                if (isRadarOpen) {
                    radarContainer.classList.remove('scale-0', 'opacity-0', 'pointer-events-none');
                    radarContainer.classList.add('scale-100', 'opacity-100');
                    btnToggleRadar.classList.add('bg-green-600/80', 'border-green-400');
                    btnToggleRadar.classList.remove('bg-black/80', 'border-slate-500');
                } else {
                    radarContainer.classList.add('scale-0', 'opacity-0', 'pointer-events-none');
                    radarContainer.classList.remove('scale-100', 'opacity-100');
                    btnToggleRadar.classList.remove('bg-green-600/80', 'border-green-400');
                    btnToggleRadar.classList.add('bg-black/80', 'border-slate-500');
                }
            });

            // 十字鍵事件綁定
            const bindDpad = (id, dir) => {
                const btn = document.getElementById(id);
                if(!btn) return;
                const press = (e) => { e.preventDefault(); dpad[dir] = true; };
                const release = (e) => { e.preventDefault(); dpad[dir] = false; };
                btn.addEventListener('touchstart', press, {passive:false});
                btn.addEventListener('touchend', release, {passive:false});
                btn.addEventListener('mousedown', press);
                btn.addEventListener('mouseup', release);
                btn.addEventListener('mouseleave', release);
            };
            bindDpad('dpad-up', 'up');
            bindDpad('dpad-down', 'down');
            bindDpad('dpad-left', 'left');
            bindDpad('dpad-right', 'right');
        };

        window.addEventListener('resize', () => {
            if(!camera) return;
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = async () => {
            initGame();         
            initUI();
            await initFirebaseData(); 
            initSpawns(); 
            updatePokedexUI();
            animate();
        };
    </script>
</body>
</html>
