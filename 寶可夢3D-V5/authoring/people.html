<!doctype html><meta charset="utf-8"><title>V5 共骨架角色驗收</title>
<script src="../vendor/three.min.js"></script><script src="../vendor/GLTFLoader.js"></script><script src="../vendor/GLTFExporter.js"></script><script src="people-source.js"></script><script src="people-rig.js"></script>
<body style="margin:0"><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0xe8ebdf);scene.add(new THREE.HemisphereLight(0xfff9ed,0x708668,.85));const light=new THREE.DirectionalLight(0xffffff,.65);light.position.set(4,8,6);scene.add(light);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(800,800);document.body.append(renderer.domElement);const camera=new THREE.OrthographicCamera(-1.75,1.75,3, -.5,.1,100);camera.position.set(0,1.1,9);camera.lookAt(0,1.1,0);scene.add(new THREE.GridHelper(20,20));let model,mixer;
window.lab={scene,camera,renderer,get model(){return model},async load(){const a=await new THREE.GLTFLoader().loadAsync('../models/player-wardrobe.glb');model=a.scene;model.animations=a.animations;scene.add(model);mixer=new THREE.AnimationMixer(model);this.suit('trainer');},suit(id){model.traverse(o=>{if(o.userData.costume)o.visible=o.userData.costume===id});},play(name,time){mixer.stopAllAction();mixer.clipAction(model.animations.find(c=>c.name===name)).play();mixer.setTime(time);model.updateMatrixWorld(true);renderer.render(scene,camera);},export(kind='trainer'){const model=V5PeopleRig.build(kind);return new Promise(resolve=>new THREE.GLTFExporter().parse(model,b=>resolve(Array.from(new Uint8Array(b))),{binary:true,animations:model.animations,onlyVisible:false}));}};
</script>
